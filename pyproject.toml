[project]
name = "rag-service"
version = "0.1.0"
description = "Enterprise RAG and light agent service designed for Cloud Run and Vertex AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zehra" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
gcp = [
  "google-genai>=1.47.0",
  "google-cloud-pubsub>=2.27.0",
  "google-cloud-aiplatform>=1.74.0",
  "asyncpg>=0.30.0",
]
otel = [
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
load = [
  "locust>=2.32.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_service = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/rag_service/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rag_service"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true

[[tool.mypy.overrides]]
module = ["google.*", "asyncpg", "asyncpg.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true
